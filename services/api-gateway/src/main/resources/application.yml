server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # Auth Service Routes (Public login & register)
        - id: auth-service-public
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/login, /api/auth/register, /api/auth/refresh

        # Auth Service Secured User Info & Roles
        - id: auth-service-secured
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/me, /api/auth/change-password, /api/users, /api/users/**, /api/roles, /api/roles/**, /api/v1/roles, /api/v1/roles/**
          filters:
            - JwtAuthenticationFilter

        # Job Service Routes
        - id: job-service
          uri: ${JOB_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/jobs/**
          filters:
            - JwtAuthenticationFilter

        # Export Service Routes
        - id: export-service
          uri: ${EXPORT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/exports, /api/exports/**, /api/v1/exports, /api/v1/exports/**
          filters:
            - JwtAuthenticationFilter

        # Import Service Routes
        - id: import-service
          uri: ${IMPORT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/imports, /api/imports/**, /api/v1/imports, /api/v1/imports/**
          filters:
            - JwtAuthenticationFilter

app:
  jwt:
    secret: ${JWT_SECRET:DataFlowPlatformSuperSecretKeyForJWTAuthTokenGeneration2026!}
