server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dataflow_db}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:DataFlowPlatformSuperSecretKeyForJWTAuthTokenGeneration2026!}
    expiration-ms: 3600000 # 1 hour
    refresh-expiration-ms: 86400000 # 24 hours
  vault:
    enabled: ${VAULT_ENABLED:true}
    uri: ${VAULT_URI:http://localhost:8200}
    token: ${VAULT_TOKEN:00000000-0000-0000-0000-000000000000}
    secret-path: ${VAULT_SECRET_PATH:secret/data/auth-service}
  security:
    aes-gcm:
      secret-key: ${AES_GCM_SECRET_KEY:DataFlowPlatformAES256GCMSecretKey2026!} # Fallback nếu Vault không online
